name: xpilot-webnet CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: xpilot-webnet-deploy
  cancel-in-progress: false

env:
  IMAGE: omnom62/xpilot-webnet

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run JS unit tests
        run: node --test tests/*.test.js

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python syntax check on the two production servers
        run: python -m py_compile web-server.py ws_server.py log_interface.py pickup_sync.py

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - id: tag
        run: echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          # This cluster mixes amd64 and arm64 nodes (OCI Always Free
          # includes Ampere A1/ARM compute) -- a single-arch image crash
          # loops with "exec format error" on whichever arch it wasn't
          # built for.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}
            ${{ env.IMAGE }}:latest

  deploy:
    needs: build-and-push
    # Matches LABELS on the in-cluster runner Deployment
    # (k8s/ci-runner/runner-deployment.yaml). This job only runs on a
    # runner living inside the k3s cluster, so the k8s API is reached
    # over the in-cluster network -- it's never exposed to the internet
    # and no kubeconfig is stored in GitHub.
    runs-on: [self-hosted, k3s-oci, xpilot]
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-kubectl@v4
        with:
          version: "v1.29.0"

      - name: Install kustomize
        run: |
          curl -sL "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/kustomize

      - name: Configure kubectl for in-cluster access
        run: |
          kubectl config set-cluster in-cluster \
            --server=https://kubernetes.default.svc \
            --certificate-authority=/var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          kubectl config set-credentials in-cluster \
            --token="$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)"
          kubectl config set-context in-cluster \
            --cluster=in-cluster --user=in-cluster --namespace=xpilot
          kubectl config use-context in-cluster

      - name: Set image tag and apply manifests
        working-directory: k8s
        run: |
          kustomize edit set image ${{ env.IMAGE }}=${{ env.IMAGE }}:${{ needs.build-and-push.outputs.image_tag }}
          kubectl apply -k .

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/ws-server -n xpilot --timeout=120s
          kubectl rollout status deployment/web-server -n xpilot --timeout=120s
