apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-server
  namespace: xpilot
  labels:
    app: xpilot
    component: web-server
spec:
  replicas: 2
  selector:
    matchLabels:
      app: xpilot
      component: web-server
  template:
    metadata:
      labels:
        app: xpilot
        component: web-server
    spec:
      containers:
        - name: web-server
          image: omnom62/xpilot-webnet:latest
          imagePullPolicy: Always
          args:
            - web-server.py
            - --host=0.0.0.0
            - --port=8000
          env:
            # Reached via the real domain over HTTPS/WSS -- cert-manager +
            # Let's Encrypt production TLS. The old IP:8888 path (plain
            # ws://) still works too as a fallback/reference.
            - name: XPILOT_WS_URL
              value: "wss://xpilot.spdns.eu/ws"
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /status
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /status
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
